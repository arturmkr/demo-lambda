AWSTemplateFormatVersion: '2010-09-09'
Description: Serverless Spring AI Image Catalog

Parameters:
  ProjectName:
    Type: String
    Default: image-catalog
  ArtifactBucket:
    Type: String
    Description: S3 bucket containing the packaged Lambda jar
  ArtifactKey:
    Type: String
    Default: app.jar
    Description: S3 object key for the packaged Lambda jar
  LambdaExecutionRoleArn:
    Type: String
    Default: ""
    Description: Existing IAM role ARN for Lambda execution
  OriginalImagesPrefix:
    Type: String
    Default: original/
    Description: S3 prefix used for original uploaded images
  ThumbnailImagesPrefix:
    Type: String
    Default: thumbnail/
    Description: S3 prefix used for generated thumbnails

Conditions:
  CreateCatalogLambdaRole: !Equals [!Ref LambdaExecutionRoleArn, ""]

Resources:
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${ProjectName}-users"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${ProjectName}-api-client"
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      SupportedIdentityProviders:
        - COGNITO

  CognitoUserGroupUser:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: USER
      Description: Standard image catalog user
      UserPoolId: !Ref CognitoUserPool
      Precedence: 20

  CognitoUserGroupAdmin:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: ADMIN
      Description: Image catalog administrator
      UserPoolId: !Ref CognitoUserPool
      Precedence: 10

  OriginalImagesPrefixParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${ProjectName}/images/original-prefix"
      Type: String
      Value: !Ref OriginalImagesPrefix
      Description: Original image object prefix for the image catalog Lambda functions

  ThumbnailImagesPrefixParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${ProjectName}/images/thumbnail-prefix"
      Type: String
      Value: !Ref ThumbnailImagesPrefix
      Description: Thumbnail image object prefix for the image catalog Lambda functions

  ImagesBucket:
    Type: AWS::S3::Bucket
    DependsOn:
      - ProcessImageInvokePermission
    Properties:
      BucketName: !Sub "${ProjectName}-images-${AWS::AccountId}-${AWS::Region}"
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt ProcessImageFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: !Ref OriginalImagesPrefix
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ImagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-images"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: imageId
          AttributeType: S
      KeySchema:
        - AttributeName: imageId
          KeyType: HASH

  CatalogLambdaRole:
    Type: AWS::IAM::Role
    Condition: CreateCatalogLambdaRole
    Properties:
      RoleName: !Sub "${ProjectName}-lambda-role-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub "${ProjectName}-catalog-policy"
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub "arn:aws:s3:::${ProjectName}-images-${AWS::AccountId}-${AWS::Region}/${OriginalImagesPrefix}*"
                  - !Sub "arn:aws:s3:::${ProjectName}-images-${AWS::AccountId}-${AWS::Region}/${ThumbnailImagesPrefix}*"
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Scan
                Resource:
                  - !GetAtt ImagesTable.Arn
              - Effect: Allow
                Action:
                  - rekognition:DetectLabels
                  - rekognition:DetectModerationLabels
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-upload:*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-my-images:*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-all-images:*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-approve:*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-reject:*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-process:*"

  UploadImageFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - OriginalImagesPrefixParameter
      - ThumbnailImagesPrefixParameter
    Properties:
      FunctionName: !Sub "${ProjectName}-upload"
      Runtime: java25
      Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
      MemorySize: 1024
      Timeout: 30
      Role: !If [CreateCatalogLambdaRole, !GetAtt CatalogLambdaRole.Arn, !Ref LambdaExecutionRoleArn]
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: uploadImage
          MAIN_CLASS: com.demo.catalog.ImageCatalogApplication
          APP_IMAGES_BUCKET: !Sub "${ProjectName}-images-${AWS::AccountId}-${AWS::Region}"
          APP_IMAGES_TABLE: !Ref ImagesTable
          APP_IMAGES_ORIGINAL_PREFIX: !Ref OriginalImagesPrefix
          APP_IMAGES_THUMBNAIL_PREFIX: !Ref ThumbnailImagesPrefix

  MyImagesFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - OriginalImagesPrefixParameter
      - ThumbnailImagesPrefixParameter
    Properties:
      FunctionName: !Sub "${ProjectName}-my-images"
      Runtime: java25
      Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
      MemorySize: 1024
      Timeout: 30
      Role: !If [CreateCatalogLambdaRole, !GetAtt CatalogLambdaRole.Arn, !Ref LambdaExecutionRoleArn]
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: listMyImages
          MAIN_CLASS: com.demo.catalog.ImageCatalogApplication
          APP_IMAGES_BUCKET: !Sub "${ProjectName}-images-${AWS::AccountId}-${AWS::Region}"
          APP_IMAGES_TABLE: !Ref ImagesTable
          APP_IMAGES_ORIGINAL_PREFIX: !Ref OriginalImagesPrefix
          APP_IMAGES_THUMBNAIL_PREFIX: !Ref ThumbnailImagesPrefix

  AllImagesFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - OriginalImagesPrefixParameter
      - ThumbnailImagesPrefixParameter
    Properties:
      FunctionName: !Sub "${ProjectName}-all-images"
      Runtime: java25
      Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
      MemorySize: 1024
      Timeout: 30
      Role: !If [CreateCatalogLambdaRole, !GetAtt CatalogLambdaRole.Arn, !Ref LambdaExecutionRoleArn]
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: listAllImages
          MAIN_CLASS: com.demo.catalog.ImageCatalogApplication
          APP_IMAGES_BUCKET: !Sub "${ProjectName}-images-${AWS::AccountId}-${AWS::Region}"
          APP_IMAGES_TABLE: !Ref ImagesTable
          APP_IMAGES_ORIGINAL_PREFIX: !Ref OriginalImagesPrefix
          APP_IMAGES_THUMBNAIL_PREFIX: !Ref ThumbnailImagesPrefix

  ApproveImageFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - OriginalImagesPrefixParameter
      - ThumbnailImagesPrefixParameter
    Properties:
      FunctionName: !Sub "${ProjectName}-approve"
      Runtime: java25
      Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
      MemorySize: 1024
      Timeout: 30
      Role: !If [CreateCatalogLambdaRole, !GetAtt CatalogLambdaRole.Arn, !Ref LambdaExecutionRoleArn]
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: approveImage
          MAIN_CLASS: com.demo.catalog.ImageCatalogApplication
          APP_IMAGES_BUCKET: !Sub "${ProjectName}-images-${AWS::AccountId}-${AWS::Region}"
          APP_IMAGES_TABLE: !Ref ImagesTable
          APP_IMAGES_ORIGINAL_PREFIX: !Ref OriginalImagesPrefix
          APP_IMAGES_THUMBNAIL_PREFIX: !Ref ThumbnailImagesPrefix

  RejectImageFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - OriginalImagesPrefixParameter
      - ThumbnailImagesPrefixParameter
    Properties:
      FunctionName: !Sub "${ProjectName}-reject"
      Runtime: java25
      Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
      MemorySize: 1024
      Timeout: 30
      Role: !If [CreateCatalogLambdaRole, !GetAtt CatalogLambdaRole.Arn, !Ref LambdaExecutionRoleArn]
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: rejectImage
          MAIN_CLASS: com.demo.catalog.ImageCatalogApplication
          APP_IMAGES_BUCKET: !Sub "${ProjectName}-images-${AWS::AccountId}-${AWS::Region}"
          APP_IMAGES_TABLE: !Ref ImagesTable
          APP_IMAGES_ORIGINAL_PREFIX: !Ref OriginalImagesPrefix
          APP_IMAGES_THUMBNAIL_PREFIX: !Ref ThumbnailImagesPrefix

  ProcessImageFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - OriginalImagesPrefixParameter
      - ThumbnailImagesPrefixParameter
    Properties:
      FunctionName: !Sub "${ProjectName}-process"
      Runtime: java25
      Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
      MemorySize: 1536
      Timeout: 60
      Role: !If [CreateCatalogLambdaRole, !GetAtt CatalogLambdaRole.Arn, !Ref LambdaExecutionRoleArn]
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: processImage
          MAIN_CLASS: com.demo.catalog.ImageCatalogApplication
          APP_IMAGES_BUCKET: !Sub "${ProjectName}-images-${AWS::AccountId}-${AWS::Region}"
          APP_IMAGES_TABLE: !Ref ImagesTable
          APP_IMAGES_ORIGINAL_PREFIX: !Ref OriginalImagesPrefix
          APP_IMAGES_THUMBNAIL_PREFIX: !Ref ThumbnailImagesPrefix

  ProcessImageInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProcessImageFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::${ProjectName}-images-${AWS::AccountId}-${AWS::Region}"

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${ProjectName}-http-api"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
        AllowOrigins:
          - '*'
        AllowHeaders:
          - '*'

  CognitoJwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      AuthorizerType: JWT
      IdentitySource:
        - '$request.header.Authorization'
      Name: !Sub "${ProjectName}-cognito-authorizer"
      JwtConfiguration:
        Audience:
          - !Ref CognitoUserPoolClient
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}"

  UploadIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt UploadImageFunction.Arn
      PayloadFormatVersion: '1.0'

  MyImagesIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt MyImagesFunction.Arn
      PayloadFormatVersion: '1.0'

  AllImagesIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AllImagesFunction.Arn
      PayloadFormatVersion: '1.0'

  ApproveImageIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApproveImageFunction.Arn
      PayloadFormatVersion: '1.0'

  RejectImageIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt RejectImageFunction.Arn
      PayloadFormatVersion: '1.0'

  UploadRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /images/upload
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Sub "integrations/${UploadIntegration}"

  MyImagesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /images/my
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Sub "integrations/${MyImagesIntegration}"

  AllImagesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /images/all
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Sub "integrations/${AllImagesIntegration}"

  ApproveImageRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /images/{id}/approve
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Sub "integrations/${ApproveImageIntegration}"

  RejectImageRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /images/{id}/reject
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      Target: !Sub "integrations/${RejectImageIntegration}"

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true

  UploadApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UploadImageFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*"

  MyImagesApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MyImagesFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*"

  AllImagesApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AllImagesFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*"

  ApproveImageApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApproveImageFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*"

  RejectImageApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RejectImageFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*"

Outputs:
  ApiBaseUrl:
    Description: API Gateway base URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  ImagesBucketName:
    Value: !Ref ImagesBucket
  ImagesTableName:
    Value: !Ref ImagesTable
  CognitoUserPoolId:
    Description: Cognito User Pool ID for demo user administration and token requests
    Value: !Ref CognitoUserPool
  CognitoUserPoolClientId:
    Description: Cognito User Pool Client ID used by API clients
    Value: !Ref CognitoUserPoolClient
